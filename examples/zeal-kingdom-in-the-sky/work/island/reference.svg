<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1600" viewBox="0 0 2400 1600">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9aa6cc"/><stop offset="0.6" stop-color="#e3c9a8"/><stop offset="1" stop-color="#f3dfa6"/></linearGradient>
<linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9d4c2"/><stop offset="1" stop-color="#9d92b0"/></linearGradient>
<!-- facet A: left lit warm -->
<linearGradient id="fA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a08c6c"/><stop offset="0.55" stop-color="#7d6a58"/><stop offset="1" stop-color="#55495a"/></linearGradient>
<linearGradient id="fA2" x1="0" y1="0" x2="0.6" y2="1"><stop offset="0" stop-color="#6e5f58"/><stop offset="1" stop-color="#6a5a70"/></linearGradient>
<!-- facet B: central dark -->
<linearGradient id="fB" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#3a3450"/><stop offset="0.7" stop-color="#2e2a44"/><stop offset="1" stop-color="#5a4e70"/></linearGradient>
<!-- facet C: right half-tone -->
<linearGradient id="fC" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6a5f78"/><stop offset="0.6" stop-color="#4a4160"/><stop offset="1" stop-color="#645670"/></linearGradient>
<!-- facet D: right dark, darkest core -->
<linearGradient id="fD" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0" stop-color="#3f3853"/><stop offset="0.6" stop-color="#26223a"/><stop offset="1" stop-color="#4c4262"/></linearGradient>
<linearGradient id="plat" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#cfc06e"/><stop offset="0.3" stop-color="#9aa65a"/><stop offset="0.7" stop-color="#6f8a52"/><stop offset="1" stop-color="#5a6e52"/></linearGradient>
<linearGradient id="fall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f8f6"/><stop offset="0.6" stop-color="#dfe8ee"/><stop offset="1" stop-color="#cdd6e4" stop-opacity="0"/></linearGradient>
<radialGradient id="mist" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#e6e2ea" stop-opacity="0.8"/><stop offset="1" stop-color="#e6e2ea" stop-opacity="0"/></radialGradient>
</defs>
